<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Dynasty — Cozy Pixel Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background: #182221;
      color: #f7f3e8;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    .wood-panel {
      background: #fdf8ee;
      color: #24332d;
      border: 3px solid #2b4c3f;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
    }
    .jade-header {
      background: #1f5c48;
      color: #ffffff;
    }
    .gold-btn {
      background: #e5b343;
      color: #231906;
      border: 2px solid #8a6212;
      box-shadow: 0 3px 0 #8a6212;
      font-weight: 800;
    }
    .gold-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #8a6212;
    }
    .action-orb {
      width: 78px;
      height: 78px;
      border-radius: 9999px;
      background: #225e4a;
      border: 3px solid #e5b343;
      box-shadow: 0 5px 0 #12362a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      text-align: center;
      line-height: 1.15;
    }
    .action-orb:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #12362a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 md:p-4">
  <!-- Top Bar: Status, Realm, Kode Permanen & Menu -->
  <div class="w-full max-w-xl wood-panel rounded-2xl overflow-hidden mb-2.5">
    <div class="jade-header px-3.5 py-2 flex justify-between items-center">
      <div>
        <div class="text-sm md:text-base font-extrabold tracking-wide flex items-center gap-1.5">
          <span>🏮 THE DYNASTY</span>
          <span id="badge-kode" class="text-[11px] bg-amber-400 text-stone-950 px-2 py-0.5 rounded-full font-extrabold">
            LOKAL
          </span>
        </div>
        <div id="sub-realm" class="text-[11px] text-emerald-100">
          Qi Condensation · Lv.1 · <span id="hud-zone">Alun-Alun Sekte</span>
        </div>
      </div>
      <button onclick="openModal('auth')" class="gold-btn px-2.5 py-1 rounded-lg text-xs">
        🔑 Akun / Kode
      </button>
    </div>

    <div class="px-3.5 py-2 flex flex-wrap justify-between items-center gap-2 text-xs bg-[#f3ead8]">
      <div class="flex items-center gap-3 font-bold">
        <span>🪙 <b id="hud-gold" class="text-amber-700">250</b></span>
        <span>🌿 <b id="hud-herb" class="text-emerald-700">3</b></span>
        <span>🪵 <b id="hud-wood" class="text-amber-900">1</b></span>
        <span>✨ EXP <b id="hud-exp" class="text-teal-700">0/100</b></span>
      </div>

      <div class="flex gap-1.5">
        <button onclick="switchZone('square')" class="px-2 py-1 rounded bg-emerald-800 text-white text-[11px] font-bold">Alun-Alun</button>
        <button onclick="switchZone('farm')" class="px-2 py-1 rounded bg-amber-700 text-white text-[11px] font-bold">Lahan</button>
        <button onclick="switchZone('forest')" class="px-2 py-1 rounded bg-stone-800 text-white text-[11px] font-bold">Hutan</button>
      </div>
    </div>
  </div>

  <!-- Main Viewport + Floating Action Buttons + Quick Menu -->
  <div class="w-full max-w-xl relative wood-panel rounded-2xl p-2 bg-[#e8dcc4]">
    <div class="relative rounded-xl overflow-hidden border-2 border-[#3b2d22]">
      <canvas id="gameCanvas" width="420" height="520" class="w-full block bg-[#e7be8a]"></canvas>

      <!-- Floating Toast Banner (ala notif panen/misi di video) -->
      <div id="toast-banner" class="hidden absolute top-3 left-1/2 -translate-x-1/2 bg-[#234e40]/95 text-amber-200 border-2 border-amber-400 px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-lg whitespace-nowrap z-20">
        Panen berhasil!
      </div>

      <!-- Right Side Quick Menu Icons (Pasar, Misi, Wardrobe) -->
      <div class="absolute top-3 right-2.5 flex flex-col gap-2 z-20">
        <button onclick="openModal('market')" class="w-10 h-10 rounded-xl bg-[#fdf8ee] border-2 border-[#2b4c3f] shadow flex flex-col items-center justify-center text-[10px] font-extrabold text-[#1f5c48]">
          🛒<span>Pasar</span>
        </button>
        <button onclick="openModal('quest')" class="w-10 h-10 rounded-xl bg-[#fdf8ee] border-2 border-[#2b4c3f] shadow flex flex-col items-center justify-center text-[10px] font-extrabold text-[#1f5c48]">
          📜<span>Misi</span>
        </button>
        <button onclick="openModal('wardrobe')" class="w-10 h-10 rounded-xl bg-[#fdf8ee] border-2 border-[#2b4c3f] shadow flex flex-col items-center justify-center text-[10px] font-extrabold text-[#1f5c48]">
          👘<span>Baju</span>
        </button>
      </div>

      <!-- Bottom-Right Contextual Action Orb (Tanam / Panen / Pukul / Duduk) -->
      <button id="context-orb" onclick="doContextAction()" class="action-orb absolute bottom-4 right-4 z-20">
        <span id="orb-icon" class="text-xl">🌱</span>
        <span id="orb-label">Tanam<br><small class="opacity-80">[E]</small></span>
      </button>

      <!-- Bottom-Left D-Pad for Mobile & Tablet -->
      <div class="absolute bottom-3 left-3 grid grid-cols-3 gap-1 w-28 h-28 z-20">
        <div></div>
        <button ontouchstart="setDir('up',true)" ontouchend="setDir('up',false)" onmousedown="setDir('up',true)" onmouseup="setDir('up',false)" class="bg-[#fdf8ee]/90 border-2 border-[#2b4c3f] rounded-lg text-xs font-black text-[#1f5c48]">▲</button>
        <div></div>
        <button ontouchstart="setDir('left',true)" ontouchend="setDir('left',false)" onmousedown="setDir('left',true)" onmouseup="setDir('left',false)" class="bg-[#fdf8ee]/90 border-2 border-[#2b4c3f] rounded-lg text-xs font-black text-[#1f5c48]">◀</button>
        <div class="bg-[#2b4c3f]/30 rounded-lg"></div>
        <button ontouchstart="setDir('right',true)" ontouchend="setDir('right',false)" onmousedown="setDir('right',true)" onmouseup="setDir('right',false)" class="bg-[#fdf8ee]/90 border-2 border-[#2b4c3f] rounded-lg text-xs font-black text-[#1f5c48]">▶</button>
        <div></div>
        <button ontouchstart="setDir('down',true)" ontouchend="setDir('down',false)" onmousedown="setDir('down',true)" onmouseup="setDir('down',false)" class="bg-[#fdf8ee]/90 border-2 border-[#2b4c3f] rounded-lg text-xs font-black text-[#1f5c48]">▼</button>
        <div></div>
      </div>
    </div>

    <div class="mt-2 px-1 flex justify-between items-center text-[11px] text-[#3c4b44]">
      <span>Gerak: <b>WASD / Panah / D-Pad</b> · Aksi: <b>E / Tombol Bulat</b></span>
      <button onclick="breakthroughRealm()" class="px-2 py-0.5 rounded bg-emerald-900 text-amber-300 font-bold">
        ⚡ Terobos
      </button>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-3 z-50">
    <div class="w-full max-w-md wood-panel rounded-2xl overflow-hidden max-h-[85vh] flex flex-col">
      <div class="jade-header px-4 py-2.5 flex justify-between items-center">
        <h3 id="modal-title" class="font-extrabold text-sm">Menu</h3>
        <button onclick="closeModal()" class="text-lg font-bold leading-none px-1">✕</button>
      </div>
      <div id="modal-body" class="p-4 overflow-y-auto text-xs space-y-3"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const app = initializeApp({
      databaseURL: "https://presiden-ri-simulator-default-rtdb.asia-southeast1.firebasedatabase.app"
    });
    const db = getDatabase(app);

    const REALMS = ["Qi Condensation", "Foundation Establishment", "Golden Core", "Nascent Soul"];
    const HATS = [
      { id: "none", name: "Sanggul Polos", price: 0, color: "#1f2937" },
      { id: "conical", name: "Caping Bambu Donghua", price: 80, color: "#d97706" },
      { id: "crown", name: "Mahkota Giok Emas", price: 160, color: "#facc15" }
    ];
    const ROBES = [
      { id: "jade", name: "Jubah Giok Sekte", price: 0, color: "#2a8c6e" },
      { id: "crimson", name: "Jubah Vermilion", price: 90, color: "#dc2626" },
      { id: "indigo", name: "Jubah Langit Malam", price: 140, color: "#3b82f6" }
    ];

    const DEFAULT_DATA = {
      code: "",
      name: "Raka",
      realmIdx: 0,
      exp: 0,
      gold: 250,
      seeds: 6,
      herbs: 3,
      wood: 1,
      questDone: 0,
      hat: "none",
      robe: "jade",
      zone: "square",
      x: 210,
      y: 340,
      sitting: false,
      plots: Array.from({ length: 12 }, (_, i) => ({
        x: 95 + (i % 4) * 58,
        y: 165 + Math.floor(i / 4) * 58,
        stage: 0 // 0=tanah kosong, 1=tumbuh, 2=siap panen
      })),
      treeHp: 3,
      treeRegrowAt: 0
    };

    let p = JSON.parse(localStorage.getItem("dynasty_cozy_save")) || structuredClone(DEFAULT_DATA);
    let activeCode = localStorage.getItem("dynasty_cozy_code") || "";
    let move = { up: false, down: false, left: false, right: false };
    let facing = "down";
    let walkTick = 0;
    let modalType = "";

    // NPCs in Square
    const npcs = [
      { name: "Dinda", x: 115, y: 220, robe: "#65a30d", bubble: "Halo, pendekar baru!" },
      { name: "Bayu", x: 295, y: 220, robe: "#475569", bubble: "Air mancur giok tenang ya." },
      { name: "Sari", x: 295, y: 155, robe: "#c2410c", bubble: "Butuh Ramuan Roh buat besok!" }
    ];

    // Bench spots in Square
    const benches = [
      { x: 115, y: 285 },
      { x: 305, y: 285 }
    ];

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    function showToast(msg) {
      const el = document.getElementById("toast-banner");
      el.innerText = msg;
      el.classList.remove("hidden");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    async function persist(syncCloud = true) {
      localStorage.setItem("dynasty_cozy_save", JSON.stringify(p));
      syncHUD();
      if (syncCloud && activeCode) {
        await set(ref(db, `dynasty_players/${activeCode}`), {
          ...p,
          kode: activeCode,
          nama: p.name,
          emas: p.gold,
          pasukan: (p.realmIdx + 1) * 50,
          wilayah: p.questDone + 1,
          log: [`[WEB] ${p.name} di ${p.zone} | Gold: ${p.gold}, Herb: ${p.herbs}`]
        });
      }
    }

    function syncHUD() {
      const zoneNames = { square: "Alun-Alun Sekte", farm: "Lahan Roh", forest: "Hutan Bambu & Roh" };
      document.getElementById("badge-kode").innerText = activeCode || "LOKAL";
      document.getElementById("sub-realm").innerHTML =
        `${REALMS[p.realmIdx]} · Lv.${p.realmIdx + 1} · <span id="hud-zone">${zoneNames[p.zone]}</span>`;
      document.getElementById("hud-gold").innerText = p.gold;
      document.getElementById("hud-herb").innerText = p.herbs;
      document.getElementById("hud-wood").innerText = p.wood;
      document.getElementById("hud-exp").innerText = `${p.exp}/100`;
      updateContextOrb();
    }

    window.switchZone = async (z) => {
      p.zone = z;
      p.sitting = false;
      p.x = 210;
      p.y = z === "square" ? 390 : 410;
      await persist();
    };

    window.setDir = (d, val) => {
      if (val) p.sitting = false;
      move[d] = val;
    };

    window.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") { p.sitting = false; move.up = true; }
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") { p.sitting = false; move.down = true; }
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") { p.sitting = false; move.left = true; }
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") { p.sitting = false; move.right = true; }
      if (e.key === "e" || e.key === "E" || e.key === " ") doContextAction();
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") move.up = false;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") move.down = false;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") move.left = false;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") move.right = false;
    });

    function getNearbyAction() {
      if (p.zone === "square") {
        for (const b of benches) {
          if (Math.hypot(p.x - b.x, p.y - b.y) < 42) {
            return { type: "sit", spot: b, icon: "🪑", label: p.sitting ? "Berdiri" : "Duduk" };
          }
        }
        for (const n of npcs) {
          if (Math.hypot(p.x - n.x, p.y - n.y) < 44) {
            return { type: "talk", npc: n, icon: "💬", label: "Sapa" };
          }
        }
      } else if (p.zone === "farm") {
        const ready = p.plots.filter((pl) => pl.stage === 2 && Math.hypot(p.x - (pl.x + 20), p.y - (pl.y + 20)) < 55);
        if (ready.length > 0) return { type: "harvest", icon: "🌾", label: "Panen" };

        const nearPlot = p.plots.find((pl) => pl.stage === 0 && Math.hypot(p.x - (pl.x + 20), p.y - (pl.y + 20)) < 44);
        if (nearPlot && p.seeds > 0) return { type: "plant", plot: nearPlot, icon: "🌱", label: "Tanam" };
      } else if (p.zone === "forest") {
        if (p.treeHp > 0 && Math.hypot(p.x - 210, p.y - 210) < 75) {
          return { type: "chop", icon: "🪓", label: "Tebang" };
        }
      }
      return { type: "none", icon: "✨", label: "Jelajah" };
    }

    function updateContextOrb() {
      const act = getNearbyAction();
      document.getElementById("orb-icon").innerText = act.icon;
      document.getElementById("orb-label").innerHTML = `${act.label}<br><small class="opacity-80">[E]</small>`;
    }

    window.doContextAction = async () => {
      const act = getNearbyAction();
      if (act.type === "sit") {
        p.sitting = !p.sitting;
        if (p.sitting) { p.x = act.spot.x; p.y = act.spot.y; }
        showToast(p.sitting ? "Duduk santai di bangku sekte." : "Berdiri kembali.");
      } else if (act.type === "talk") {
        p.exp += 8;
        showToast(`${act.npc.name}: "${act.npc.bubble}" (+8 EXP)`);
      } else if (act.type === "plant") {
        // Plant row of up to 3 nearby empty plots (ala tanam sebaris di video)
        let planted = 0;
        for (const pl of p.plots) {
          if (pl.stage === 0 && p.seeds > 0 && Math.hypot(p.x - (pl.x + 20), p.y - (pl.y + 20)) < 68) {
            pl.stage = 1;
            p.seeds -= 1;
            planted++;
            setTimeout(async () => {
              pl.stage = 2;
              await persist(false);
            }, 3500);
          }
        }
        if (planted > 0) showToast(`Menanam ${planted} Bibit Roh! Tunggu 3.5 detik...`);
      } else if (act.type === "harvest") {
        let count = 0;
        for (const pl of p.plots) {
          if (pl.stage === 2 && Math.hypot(p.x - (pl.x + 20), p.y - (pl.y + 20)) < 75) {
            pl.stage = 0;
            count++;
          }
        }
        if (count > 0) {
          p.herbs += count * 2;
          p.exp += count * 6;
          showToast(`Panen Ramuan Roh x${count * 2} · +${count * 6} EXP`);
        }
      } else if (act.type === "chop") {
        p.treeHp -= 1;
        if (p.treeHp <= 0) {
          p.wood += 2;
          p.exp += 15;
          showToast("Pohon Roh tumbang! +2 Kayu Roh & +15 EXP");
          setTimeout(() => { p.treeHp = 3; }, 8000);
        } else {
          showToast(`Menebang Pohon Roh... (${p.treeHp} pukulan lagi)`);
        }
      }
      await persist();
    };

    window.breakthroughRealm = async () => {
      if (p.realmIdx >= REALMS.length - 1) return showToast("Sudah di puncak Nascent Soul!");
      if (p.exp < 100) return showToast("Butuh 100 EXP untuk terobos Realm!");
      p.exp -= 100;
      p.realmIdx += 1;
      showToast(`⚡ Terobos ke ${REALMS[p.realmIdx]}!`);
      await persist();
    };

    // Modals: Market, Quest, Wardrobe, Auth
    window.openModal = (type) => {
      modalType = type;
      const body = document.getElementById("modal-body");
      const title = document.getElementById("modal-title");
      document.getElementById("modal-backdrop").classList.remove("hidden");

      if (type === "market") {
        title.innerText = "🛒 Pasar Sekte Giok";
        body.innerHTML = `
          <div class="flex justify-between items-center p-2.5 bg-white rounded-xl border">
            <div><b>Bibit Ramuan Roh x5</b><div class="text-stone-500">Tanam di Lahan Roh</div></div>
            <button onclick="buyPack('seeds',5,50)" class="gold-btn px-3 py-1.5 rounded-lg">🪙 50</button>
          </div>
          <div class="flex justify-between items-center p-2.5 bg-white rounded-xl border">
            <div><b>Jual Semua Ramuan Roh (${p.herbs})</b><div class="text-stone-500">Harga 25 Gold / buah</div></div>
            <button onclick="sellAllHerbs()" class="gold-btn px-3 py-1.5 rounded-lg">Jual</button>
          </div>
          <div class="flex justify-between items-center p-2.5 bg-white rounded-xl border">
            <div><b>Jual Kayu Roh (${p.wood})</b><div class="text-stone-500">Harga 40 Gold / batang</div></div>
            <button onclick="sellAllWood()" class="gold-btn px-3 py-1.5 rounded-lg">Jual</button>
          </div>
        `;
      } else if (type === "quest") {
        title.innerText = "📜 Permintaan Warga Sekte";
        body.innerHTML = `
          <div class="p-3 bg-white rounded-xl border space-y-2">
            <div class="font-bold text-sm">Sari butuh Ramuan Roh x4</div>
            <div class="text-stone-600">Di tas: <b>${p.herbs}/4</b> · Imbalan: <b>120 Gold + 35 EXP</b></div>
            <button onclick="completeQuest()" class="gold-btn w-full py-2 rounded-lg">Serahkan</button>
          </div>
          <div class="text-stone-600">Misi selesai: <b>${p.questDone}</b></div>
        `;
      } else if (type === "wardrobe") {
        title.innerText = "👘 Wardrobe Donghua";
        body.innerHTML = `
          <div class="font-bold">Topi / Mahkota</div>
          ${HATS.map((h) => {
            const owned = p.gold >= h.price || p.hat === h.id || h.price === 0;
            return `<div class="flex justify-between items-center p-2 bg-white rounded-lg border">
              <span>${h.name}</span>
              <button onclick="pickHat('${h.id}',${h.price})" class="gold-btn px-2.5 py-1 rounded">
                ${p.hat === h.id ? "Dipakai" : (h.price === 0 ? "Pakai" : `🪙 ${h.price}`)}
              </button>
            </div>`;
          }).join("")}
          <div class="font-bold pt-2">Jubah Kultivator</div>
          ${ROBES.map((r) => `<div class="flex justify-between items-center p-2 bg-white rounded-lg border">
            <span>${r.name}</span>
            <button onclick="pickRobe('${r.id}',${r.price})" class="gold-btn px-2.5 py-1 rounded">
              ${p.robe === r.id ? "Dipakai" : (r.price === 0 ? "Pakai" : `🪙 ${r.price}`)}
            </button>
          </div>`).join("")}
        `;
      } else if (type === "auth") {
        title.innerText = "🔑 Kode Akun Permanen (Web & WA)";
        body.innerHTML = `
          <p class="text-stone-600">Daftar atau masukkan kode permanen (misal <b>DYN-1234</b>) untuk menjaga data di Web & Bot WA.</p>
          <div class="flex gap-1.5">
            <input id="in-name" value="${p.name}" placeholder="Nama Karakter" class="flex-1 px-2.5 py-1.5 rounded border bg-white" />
            <button onclick="createPermCode()" class="gold-btn px-3 py-1.5 rounded">Daftar</button>
          </div>
          <div class="flex gap-1.5 pt-2 border-t">
            <input id="in-code" value="${activeCode}" placeholder="Kode DYN-XXXX" class="flex-1 px-2.5 py-1.5 rounded border bg-white uppercase" />
            <button onclick="signInPermCode()" class="px-3 py-1.5 rounded bg-emerald-800 text-white font-bold">Masuk</button>
          </div>
          ${activeCode ? `<div class="p-2 rounded bg-emerald-100 text-emerald-900 font-bold">Kode Aktif: ${activeCode}</div>` : ""}
        `;
      }
    };

    window.closeModal = () => document.getElementById("modal-backdrop").classList.add("hidden");

    window.buyPack = async (item, qty, cost) => {
      if (p.gold < cost) return showToast("Gold tidak cukup!");
      p.gold -= cost;
      p[item] += qty;
      await persist();
      openModal(modalType);
      showToast(`Membeli +${qty} Bibit!`);
    };

    window.sellAllHerbs = async () => {
      if (p.herbs <= 0) return showToast("Tidak ada Ramuan Roh.");
      const gain = p.herbs * 25;
      p.herbs = 0; p.gold += gain;
      await persist(); openModal(modalType); showToast(`+${gain} Gold!`);
    };

    window.sellAllWood = async () => {
      if (p.wood <= 0) return showToast("Tidak ada Kayu Roh.");
      const gain = p.wood * 40;
      p.wood = 0; p.gold += gain;
      await persist(); openModal(modalType); showToast(`+${gain} Gold!`);
    };

    window.completeQuest = async () => {
      if (p.herbs < 4) return showToast("Butuh 4 Ramuan Roh!");
      p.herbs -= 4; p.gold += 120; p.exp += 35; p.questDone += 1;
      await persist(); openModal(modalType); showToast("Misi selesai! +120 Gold & +35 EXP");
    };

    window.pickHat = async (id, price) => {
      if (p.hat !== id && price > 0) {
        if (p.gold < price) return showToast("Gold tidak cukup!");
        p.gold -= price;
      }
      p.hat = id;
      await persist(); openModal("wardrobe");
    };

    window.pickRobe = async (id, price) => {
      if (p.robe !== id && price > 0) {
        if (p.gold < price) return showToast("Gold tidak cukup!");
        p.gold -= price;
      }
      p.robe = id;
      await persist(); openModal("wardrobe");
    };

    window.createPermCode = async () => {
      const nm = document.getElementById("in-name").value.trim() || "Pendekar";
      const code = `DYN-${Math.floor(1000 + Math.random() * 9000)}`;
      p.name = nm; p.code = code; activeCode = code;
      localStorage.setItem("dynasty_cozy_code", code);
      await persist(true);
      attachCodeSync(code);
      openModal("auth");
      showToast(`Kode Permanen: ${code}`);
    };

    window.signInPermCode = async () => {
      const code = document.getElementById("in-code").value.trim().toUpperCase();
      if (!code) return;
      const snap = await get(ref(db, `dynasty_players/${code}`));
      if (!snap.exists()) return showToast("Kode tidak ditemukan!");
      activeCode = code;
      localStorage.setItem("dynasty_cozy_code", code);
      p = { ...structuredClone(DEFAULT_DATA), ...snap.val(), code };
      await persist(false);
      attachCodeSync(code);
      openModal("auth");
      showToast(`Masuk sebagai ${p.name}`);
    };

    function attachCodeSync(code) {
      onValue(ref(db, `dynasty_players/${code}`), (snap) => {
        if (!snap.exists()) return;
        const d = snap.val();
        if (typeof d.gold === "number") p.gold = d.gold;
        if (typeof d.exp === "number") p.exp = d.exp;
        if (typeof d.herbs === "number") p.herbs = d.herbs;
        if (typeof d.seeds === "number") p.seeds = d.seeds;
        syncHUD();
      });
    }

    function drawChibi(x, y, name, robeColor, hatId, bob) {
      const rx = Math.round(x);
      const ry = Math.round(y + bob);
      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillRect(rx - 10, Math.round(y) + 12, 20, 5);
      // Body / Robe
      ctx.fillStyle = robeColor;
      ctx.fillRect(rx - 9, ry, 18, 13);
      ctx.strokeStyle = "#2b1f17";
      ctx.lineWidth = 2;
      ctx.strokeRect(rx - 9, ry, 18, 13);
      // Big Cute Pixel Head (ala video)
      ctx.fillStyle = "#fde2b8";
      ctx.fillRect(rx - 12, ry - 16, 24, 17);
      ctx.strokeRect(rx - 12, ry - 16, 24, 17);
      // Hair & Eyes
      ctx.fillStyle = "#27201c";
      ctx.fillRect(rx - 12, ry - 18, 24, 6);
      ctx.fillRect(rx - 6, ry - 8, 3, 4);
      ctx.fillRect(rx + 4, ry - 8, 3, 4);

      if (hatId === "conical") {
        ctx.fillStyle = "#d97706";
        ctx.beginPath();
        ctx.moveTo(rx - 18, ry - 15);
        ctx.lineTo(rx, ry - 26);
        ctx.lineTo(rx + 18, ry - 15);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (hatId === "crown") {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(rx - 9, ry - 23, 18, 6);
        ctx.strokeRect(rx - 9, ry - 23, 18, 6);
      }

      // Floating Name Tag
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.fillRect(rx - 28, ry - 36, 56, 13);
      ctx.fillStyle = "#1d2b26";
      ctx.fillText(name, rx, ry - 26);
      ctx.textAlign = "left";
    }

    function loop() {
      const spd = 2.6;
      let moving = false;
      if (!p.sitting) {
        if (move.up) { p.y -= spd; facing = "up"; moving = true; }
        if (move.down) { p.y += spd; facing = "down"; moving = true; }
        if (move.left) { p.x -= spd; facing = "left"; moving = true; }
        if (move.right) { p.x += spd; facing = "right"; moving = true; }
      }
      p.x = Math.max(24, Math.min(396, p.x));
      p.y = Math.max(95, Math.min(485, p.y));
      if (moving) walkTick += 0.25;

      // Zone Background
      if (p.zone === "square") {
        ctx.fillStyle = "#cfc9be";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Stone tiles
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        for (let gx = 0; gx < canvas.width; gx += 42) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
        }
        // Pavilion roof top
        ctx.fillStyle = "#9a5b3c";
        ctx.fillRect(0, 0, canvas.width, 82);
        ctx.fillStyle = "#f5e6c8";
        ctx.fillRect(110, 18, 200, 44);
        ctx.fillStyle = "#2b4c3f";
        ctx.font = "bold 13px monospace";
        ctx.fillText("BALAI SEKTEN & ALUN-ALUN", 122, 45);

        // Fountain
        ctx.fillStyle = "#94a3b8";
        ctx.fillRect(172, 200, 76, 52);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(180, 208, 60, 36);

        // Benches
        for (const b of benches) {
          ctx.fillStyle = "#8b5a2b";
          ctx.fillRect(b.x - 18, b.y - 6, 36, 14);
          ctx.strokeStyle = "#3b2310";
          ctx.strokeRect(b.x - 18, b.y - 6, 36, 14);
        }

        // NPCs
        for (const n of npcs) {
          drawChibi(n.x, n.y, n.name, n.robe, "none", 0);
        }
      } else if (p.zone === "farm") {
        ctx.fillStyle = "#e8be86";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2d5a3c";
        ctx.font = "bold 12px monospace";
        ctx.fillText("LAHAN RAMUAN ROH", 20, 32);

        for (const pl of p.plots) {
          ctx.fillStyle = pl.stage === 0 ? "#b68756" : "#7c522c";
          ctx.fillRect(pl.x, pl.y, 40, 40);
          ctx.strokeStyle = "#5c3a1e";
          ctx.strokeRect(pl.x, pl.y, 40, 40);
          if (pl.stage === 1) {
            ctx.fillStyle = "#65a30d";
            ctx.fillRect(pl.x + 15, pl.y + 15, 10, 10);
          } else if (pl.stage === 2) {
            ctx.fillStyle = "#16a34a";
            ctx.fillRect(pl.x + 10, pl.y + 8, 20, 22);
            ctx.fillStyle = "#facc15";
            ctx.fillRect(pl.x + 16, pl.y + 5, 8, 6);
          }
        }
      } else {
        ctx.fillStyle = "#3b593f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 12px monospace";
        ctx.fillText("HUTAN POHON ROH", 20, 32);

        if (p.treeHp > 0) {
          // Giant Spirit Tree (ala pohon raksasa di video)
          ctx.fillStyle = "#7c4a27";
          ctx.fillRect(194, 200, 32, 36);
          ctx.fillStyle = "#ea8c55";
          ctx.fillRect(150, 125, 120, 82);
          ctx.fillStyle = "#facc15";
          ctx.fillRect(172, 142, 76, 44);
        } else {
          ctx.fillStyle = "#7c4a27";
          ctx.fillRect(196, 212, 28, 14);
        }
      }

      const bob = moving ? Math.sin(walkTick) * 3 : 0;
      drawChibi(p.x, p.y, p.name, ROBES.find((r) => r.id === p.robe)?.color || "#2a8c6e", p.hat, bob);
      updateContextOrb();
      requestAnimationFrame(loop);
    }

    if (activeCode) attachCodeSync(activeCode);
    syncHUD();
    loop();
  </script>
</body>
</html>
